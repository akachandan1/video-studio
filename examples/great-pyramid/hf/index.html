<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>What's inside the Great Pyramid? (Kurzgesagt-style sample)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #121417; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #121417; }
      #shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #fade { position: absolute; inset: 0; background: #000; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1080">
      <!-- painted in huashu-art-motion (demos/pyramid), edited here -->
      <video id="shot" class="clip" src="assets/pyramid.mp4" data-start="0" data-duration="16" data-track-index="0" muted playsinline></video>
      <div id="fx" class="clip" data-start="0" data-duration="16" data-track-index="1" style="position: absolute; inset: 0; pointer-events: none">
        <div id="fade" data-layout-allow-occlusion></div>
      </div>
      <audio id="score" src="assets/score.wav" data-start="0" data-duration="16" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#fade", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.out" }, 0);
      tl.to("#fade", { opacity: 1, duration: 0.6, ease: "power1.in" }, 15.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
